name: Sync & Generate News Preview

on:
  repository_dispatch:
    types: [update_berita_otomatis]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Static Site Generator via Payload
        env:
          RAW_PAYLOAD_DATA: ${{ github.event.client_payload.data_berita }}
        run: |
          # Membaca data kiriman langsung dari environment
          python generate.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
