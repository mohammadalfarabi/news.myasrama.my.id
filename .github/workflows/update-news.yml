name: Sync & Generate News Preview

on:
  schedule:
    # Berjalan otomatis setiap 5 menit
    - cron: '*/5 * * * *'
  workflow_dispatch: # Mengizinkan trigger manual via dashboard GitHub

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Static Site Generator
      env:
        # Menghubungkan variabel environment Python dengan GitHub Secrets kamu
        ASRAMA_NEWS_TOKEN: ${{ secrets.ASRAMA_NEWS_TOKEN }}
      run: python generate.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Tambahkan semua file baru hasil generate di dalam folder docs
        git add docs/
        
        # Lakukan commit jika terdapat perbedaan file baru/perubahan struktur berita
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada berita baru yang ditemukan. Melewati proses commit."
        else
          git commit -m "Auto-update: Sinkronisasi berkas berita terbaru [skip ci]"
          git push origin main
        fi
