<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{judul} - Asrama UTM</title>

    <!-- Tempat Meta Tag OG Otomatis Diletakkan -->
    {og_meta}

    <!-- Modern Dashboard Minimalist Styling -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .preview-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .image-container {
            width: 100%;
            height: 240px;
            background-color: #e2e8f0;
            overflow: hidden;
            position: relative;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .content {
            padding: 24px;
        }
        .meta-date {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }
        .title {
            font-size: 1.35rem;
            color: #1e293b;
            line-height: 1.4;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .description {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .redirect-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #cbd5e1;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .btn-link {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
            width: 100%;
        }
        .btn-link:hover {
            background-color: #1d4ed8;
        }
        .redirect-text {
            font-size: 0.85rem;
            color: #64748b;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="preview-card">
        <div class="image-container">
            <img src="{url_gambar}" alt="{judul}">
        </div>
        <div class="content">
            <span class="meta-date">{tanggal}</span>
            <h1 class="title">{judul}</h1>
            <p class="description">{deskripsi}</p>
            
            <div class="redirect-box">
                <div class="loading-spinner"></div>
                <p class="redirect-text">Mengalihkan Anda ke Website Resmi My Asrama...</p>
                <a href="{url_tujuan}" class="btn-link">Buka Manual</a>
            </div>
        </div>
    </div>

    <!-- Skrip Otomatis Redirect ke Artikel Asli -->
    <script>
        setTimeout(function() {
            window.location.href = "{url_tujuan}";
        }, 3000);
    </script>

</body>
</html>
