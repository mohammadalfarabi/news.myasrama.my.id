<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{judul} - My Asrama</title>
    <meta name="description" content="{deskripsi}">

    {og_meta}

    <meta property="og:type" content="article">
    <meta property="og:title" content="{judul}">
    <meta property="og:description" content="{deskripsi}">
    <meta property="og:image" content="{url_gambar}">
    <meta property="og:image:secure_url" content="{url_gambar}">
    <meta property="og:url" content="{url_berita}">
    <meta property="og:site_name" content="My Asrama">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="id_ID">

    <meta name="twitter:card" content="summary_large_image">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f8fafc;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        .news-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
            color: #2563eb;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .news-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
        }

        .detail-header {
            margin-bottom: 20px;
        }

        .detail-title {
            font-size: 2.25rem;
            line-height: 1.3;
            color: #0f172a;
            font-weight: 800;
            margin: 0 0 14px 0;
            letter-spacing: -0.02em;
        }

        .detail-meta {
            color: #64748b;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-hero-img {
            width: 100%;
            max-height: 450px;
            border-radius: 12px;
            margin: 24px 0 32px 0;
            display: block;
            object-fit: cover;
        }

        .detail-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #334155;
        }

        .detail-content p {
            margin-bottom: 1.5rem;
        }

        .detail-content ul,
        .detail-content ol {
            margin-left: 24px;
            margin-bottom: 1.5rem;
        }

        .detail-content a {
            color: #2563eb;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .detail-content img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 16px 0;
        }

        /* --- IKLAN STATIS SMALLEST & UNOBTRUSIVE --- */
        .ad-compact {
            margin: 32px 0 16px 0;
            padding-top: 20px;
            border-top: 1px dashed #e2e8f0;
            display: flex;
            justify-content: center;
        }

        .ad-compact-link {
            display: inline-block;
            max-width: 320px; /* Membatasi lebar agar tetap mungil */
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            opacity: 0.88;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .ad-compact-link:hover {
            opacity: 1;
            transform: scale(1.01);
        }

        .ad-compact-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
        }
        /* ------------------------------------------- */

        .rekomendasi-section {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid #e2e8f0;
        }

        .rekomendasi-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
        }

        .rekomendasi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .rekomendasi-card {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .rekomendasi-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08);
            border-color: #cbd5e1;
        }

        .rekomendasi-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .rekomendasi-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .rekomendasi-date {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
        }

        .rekomendasi-item-title {
            font-size: 0.925rem;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 640px) {
            body {
                padding: 16px 12px;
            }

            .news-card {
                padding: 20px;
                border-radius: 12px;
            }

            .detail-title {
                font-size: 1.6rem;
            }

            .rekomendasi-grid {
                grid-template-columns: 1fr;
            }

            .ad-compact-link {
                max-width: 100%;
            }
        }

        /* ================= POPUP IKLAN UTL.MY.ID ================= */
.utl-popup {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 180px;
    aspect-ratio: 1 / 1;
    z-index: 9999;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    overflow: hidden;
    animation: utlPopupIn 0.4s ease;
}

.utl-popup a {
    display: block;
    width: 100%;
    height: 100%;
}

.utl-popup img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.utl-popup-close {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 25px;
    height: 25px;
    border: none;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.75);
    color: #fff;
    font-size: 16px;
    line-height: 25px;
    text-align: center;
    cursor: pointer;
    z-index: 2;
    padding: 0;
}

.utl-popup-close:hover {
    background: #0f172a;
}

@keyframes utlPopupIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (max-width: 640px) {
    .utl-popup {
        width: 145px;
        right: 12px;
        bottom: 12px;
        border-radius: 12px;
    }

    .utl-popup-close {
        width: 22px;
        height: 22px;
        line-height: 22px;
        font-size: 14px;
    }
}
/* ======================================================= */
    </style>
</head>
<body>

<div class="news-container">

    <a href="https://myasrama.my.id/berita/index.php" class="back-link">
        ← Kembali ke Daftar Berita
    </a>

    <article class="news-card">
        <header class="detail-header">
            <h1 class="detail-title">{judul}</h1>
            <div class="detail-meta">
                Diterbitkan pada: <strong>{tanggal}</strong>
            </div>
        </header>

        <img src="{url_gambar}" class="detail-hero-img" alt="{judul}">

        <div class="detail-content">
            {isi}
        </div>

        <!-- ================= IKLAN KECIL / MINIMALIS ================= -->
        <div class="ad-compact">
            <a href="https://cekloh.netlify.app" target="_blank" rel="noopener noreferrer" class="ad-compact-link" title="Cek Plagiasi Cekloh">
                <img src="https://i.ibb.co.com/dw1jcwGB/e95925ac-2bba-4aa0-822b-d489877be067.jpg" alt="Cekloh Cek Plagiasi" class="ad-compact-img">
            </a>
        </div>
        <!-- ========================================================== -->

        {rekomendasi}
    </article>

</div>
<div class="utl-popup" id="utlPopup">

    <button
        type="button"
        class="utl-popup-close"
        onclick="document.getElementById('utlPopup').style.display='none'"
        aria-label="Tutup iklan">
        ×
    </button>

    <a
        href="https://utl.my.id"
        target="_blank"
        rel="noopener noreferrer"
        title="Pendekkan URL Gratis di utl.my.id">

        <img
            src="https://i.ibb.co.com/wh1zcBqN/Gemini-Generated-Image-ve2khjve2khjve2k.png"
            alt="utl.my.id - Pemendek URL Gratis">

    </a>
</div>
</body>
</html>
