<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{judul} - My Asrama News</title>
    
    <!-- Meta Tags Utama -->
    <meta name="description" content="{deskripsi}">
    <link rel="canonical" href="{url_preview}">

    <!-- Open Graph / Facebook / WhatsApp / Telegram -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="My Asrama News">
    <meta property="og:title" content="{judul}">
    <meta property="og:description" content="{deskripsi}">
    <meta property="og:url" content="{url_preview}">
    <meta property="og:image" content="{url_gambar}">
    <meta property="og:image:secure_url" content="{url_gambar}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{judul}">
    <meta name="twitter:description" content="{deskripsi}">
    <meta name="twitter:image" content="{url_gambar}">

    <!-- Auto Redirect setelah 2 detik ke Website Utama -->
    <meta http-equiv="refresh" content="2;url={url_tujuan}">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 90%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 1.3rem;
            color: #111827;
            line-height: 1.4;
            margin: 10px 0;
        }
        .date {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 15px;
        }
        .excerpt {
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: left;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(30, 58, 138, 0.1);
            border-radius: 50%;
            border-top-color: #1e3a8a;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .redirect-text {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-top: 10px;
        }
        .btn-fallback {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #1e3a8a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-fallback:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">My Asrama News</div>
    <div class="spinner"></div>
    <p class="redirect-text">Mengalihkan ke website utama dalam 2 detik...</p>
    
    <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">
    
    <h1>{judul}</h1>
    <div class="date">{tanggal}</div>
    <p class="excerpt">{potongan_isi}</p>
    
    <a href="{url_tujuan}" class="btn-fallback">Baca Berita Selengkapnya</a>
</div>

</body>
</html>
