<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{judul} - Asrama UTM</title>

    <!-- Tempat Meta Tag OG Otomatis Diletakkan -->
    {og_meta}

    <!-- CSS / Style bawaan kamu di bawah ini -->
    <style>
        body {
            font-family: sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body>
    <!-- Struktur halaman preview berita kamu -->
    <h1>{judul}</h1>
    <p><small>{tanggal}</small></p>
    <img src="{url_gambar}" alt="{judul}" style="max-width:100%;">
    <p>{potongan_isi}</p>
    
    <hr>
    <a href="{url_tujuan}">Baca Selengkapnya di Website Utama</a>
</body>
</html>
